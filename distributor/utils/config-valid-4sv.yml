codeGenerationParameters:
  mode: single                    # single | watch
  inputFolder: '../../js-dddsample'              # monolith folder
  outputFolder: '../dist/sv4'  # distributed folder
  cleanOutput: true               # delete output folder before?
  generateProjects: false          # generate new npm projects?
  generateDocker: true            # generate docker files for each server?
  generateTestServers: false       # Generate test server, default is to not generate
  generateMetricsServer: true
  ignore:                         # ignore the following folders
     - "node_modules"
  #   - "main*"
  #   - "product.js"
rabbitParameters:               # Details of the RabbitMQ communication
  url: host.docker.internal
  port: 5672
  numConnectionAttempts: 5
  timeBetweenAttempts: 10  
servers:
  - id: alpha
    copyFiles:
      - from: html_package.json    # relative to current path
        to: package.json  
      - from: .env
        to: .env
      - from: .env.docker
        to: .env.docker
  - id: beta
    http:
      url: beta
      port: 3002
    copyFiles:
      - from: def_package.json    # relative to current path
        to: package.json  
      - from: .env
        to: .env
      - from: .env.docker
        to: .env.docker
    functions:
    - declarationPattern: createCargo
      method: http-get
  - id: gamma
    copyFiles:
      - from: def_package.json    # relative to current path
        to: package.json
      - from: .env
        to: .env
      - from: .env.docker
        to: .env.docker
    http:
      url: gamma
      port: 3003
    functions:
    - declarationPattern: assignCargoToRoute
      method: http-post
  - id: theta
    copyFiles:
      - from: def_package.json    # relative to current path
        to: package.json
      - from: .env
        to: .env
      - from: .env.docker
        to: .env.docker
    http:
      url: theta
      port: 3004
    functions:
    - declarationPattern: listShippingLocations
      method: rabbit
      rabbitConfig:
        queue: cargoData
        callbackQueue: cargoDataCallBack