networks:
  dddsample:
    external: true   # shared with app containers and infra

services:
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: dddsample-prometheus
    # host.docker.internal lets Prometheus reach apps running on the HOST
    # (used in host mode). In docker mode the app containers are reached by
    # service name via the dddsample network instead.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'   # k6 pushes metrics here
    ports:
      - "9090:9090"
    networks:
      - dddsample
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.3
    container_name: dddsample-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "8081:3000"
    networks:
      - dddsample
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: dddsample-cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8082:8080"
    networks:
      - dddsample
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
